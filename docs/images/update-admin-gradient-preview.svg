<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 176" role="img" aria-labelledby="title description">
  <title id="title">Comparaison du dégradé de l’administration Faluss</title>
  <desc id="description">La couleur médiane passe de bleu 263f7d à bleu 294782.</desc>
  <defs>
    <linearGradient id="before" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#121e3b"/>
      <stop offset=".58" stop-color="#263f7d"/>
      <stop offset="1" stop-color="#3b5eb5"/>
    </linearGradient>
    <linearGradient id="after" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#121e3b"/>
      <stop offset=".58" stop-color="#294782"/>
      <stop offset="1" stop-color="#3b5eb5"/>
    </linearGradient>
  </defs>
  <rect width="920" height="176" fill="#f5f7fb"/>
  <rect x="20" y="20" width="430" height="136" rx="20" fill="url(#before)"/>
  <rect x="470" y="20" width="430" height="136" rx="20" fill="url(#after)"/>
  <g fill="#fff" font-family="Arial, sans-serif">
    <text x="44" y="67" font-size="13" font-weight="bold">AVANT · 0.3.0</text>
    <text x="44" y="108" font-size="29" font-weight="bold">Faluss Platform</text>
    <text x="494" y="67" font-size="13" font-weight="bold">APRÈS · PROCHAINE VERSION</text>
    <text x="494" y="108" font-size="29" font-weight="bold">Faluss Platform</text>
  </g>
</svg>
