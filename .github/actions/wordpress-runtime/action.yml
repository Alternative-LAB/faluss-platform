name: Isolated WordPress runtime
description: Install pinned PHP, Composer, MariaDB, WordPress and WP-CLI test tools.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
        extensions: mysqli, pdo_mysql, mbstring
        tools: composer:v2
    - uses: ramsey/composer-install@v3
    - name: Install isolated database binaries
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y mariadb-server mariadb-client
    - name: Keep disposable fixtures on bounded memory storage
      if: ${{ runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -euo pipefail
        sudo mount -t tmpfs -o size=1G,mode=1777,nosuid,nodev tmpfs /var/tmp
        test "$(findmnt -n -o FSTYPE --target /var/tmp)" = tmpfs
    - name: Fetch pinned WordPress and CLI test tools
      shell: bash
      run: |
        set -euo pipefail
        curl --fail --silent --show-error --location https://wordpress.org/wordpress-7.1.2.tar.gz -o "$RUNNER_TEMP/wordpress.tar.gz"
        curl --fail --silent --show-error --location https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o "$RUNNER_TEMP/wp-cli.phar"
        echo "c0c666689d66b870d8825500bb8e402ed04de52602c61a6f516c6236b8c9ac67  $RUNNER_TEMP/wordpress.tar.gz" | sha256sum --check
        echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $RUNNER_TEMP/wp-cli.phar" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" -C "$RUNNER_TEMP"
        git archive HEAD -o "$RUNNER_TEMP/plugin.tar"
    - name: Cache immutable CLI bytecode within this job
      shell: bash
      run: |
        set -euo pipefail
        php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);'
        ci_php_binary="$(command -v php)"
        ci_php_cache="$RUNNER_TEMP/php-cli-bytecode"
        mkdir -m 700 "$ci_php_cache"
        mkdir -p "$RUNNER_TEMP/php-cli-bin"
        : > "$ci_php_cache/blacklist"
        install -m 755 "$GITHUB_ACTION_PATH/php" "$RUNNER_TEMP/php-cli-bin/php"
        echo "FALUSS_CI_PHP_BINARY=$ci_php_binary" >> "$GITHUB_ENV"
        echo "FALUSS_CI_PHP_CACHE=$ci_php_cache" >> "$GITHUB_ENV"
        echo "$RUNNER_TEMP/php-cli-bin" >> "$GITHUB_PATH"
