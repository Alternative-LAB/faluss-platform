name: Publish private release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - faluss-platform.php

permissions:
  contents: write

concurrency:
  group: private-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and tag release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          plugin_version="$(sed -n 's/^ \* Version: //p' faluss-platform.php | head -n 1)"
          if [[ -z "$plugin_version" ]]; then
            echo 'Plugin version header is missing.' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == 'tag' && "$GITHUB_REF_NAME" != "v$plugin_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version v$plugin_version." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == 'branch' ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$plugin_version" >/dev/null 2>&1; then
              echo "Version v$plugin_version is already tagged; nothing to publish."
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Install production dependencies
        if: steps.version.outputs.publish == 'true'
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Build plugin archive
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          package_root="$(mktemp -d)"
          mkdir -p "$package_root/faluss-platform"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.cache' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='phpstan' \
            --exclude='phpunit.xml' \
            --exclude='phpstan.neon' \
            ./ "$package_root/faluss-platform/"
          (cd "$package_root" && zip -qr "$RUNNER_TEMP/faluss-platform.zip" faluss-platform)

      - name: Verify production archive
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/faluss-platform.zip"
          unzip -Z1 "$archive" > "$RUNNER_TEMP/archive-entries.txt"
          for path in \
            faluss-platform/faluss-platform.php \
            faluss-platform/vendor/autoload.php \
            faluss-platform/vendor/yahnis-elsts/plugin-update-checker/load-v5p7.php \
            faluss-platform/vendor/stripe/stripe-php/init.php; do
            grep -Fxq "$path" "$RUNNER_TEMP/archive-entries.txt" || {
              echo "Required package file is missing: $path" >&2
              exit 1
            }
          done

      - name: Tag verified release
        if: steps.version.outputs.publish == 'true' && github.ref_type == 'branch'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.plugin_version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$RELEASE_VERSION" -m "Faluss Platform $RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Upload package to Faluss update server
        if: steps.version.outputs.publish == 'true'
        env:
          UPLOAD_TOKEN: ${{ secrets.WP_UPDATE_UPLOAD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$UPLOAD_TOKEN" ]]; then
            echo 'WP_UPDATE_UPLOAD_TOKEN is not configured.' >&2
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer $UPLOAD_TOKEN" \
            -F 'slug=faluss-platform' \
            -F "package=@$RUNNER_TEMP/faluss-platform.zip" \
            'https://updates.faluss.com/?action=upload'

      - name: Store published archive
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: faluss-platform-${{ steps.version.outputs.plugin_version }}
          path: ${{ runner.temp }}/faluss-platform.zip
          if-no-files-found: error
          retention-days: 30
