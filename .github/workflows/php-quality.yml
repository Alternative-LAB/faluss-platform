name: PHP quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: php-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    name: Lint, static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, mbstring, xml
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Composer configuration
        run: composer validate --strict
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l faluss-platform.php
      - name: Static analysis
        run: composer analyse
      - name: Unit tests
        run: composer test
      - name: Isolated recipe clock concurrency
        run: python3 -m unittest discover -s tests/TokenEngine/recipe -p 'test_recipe_clock.py'
      - name: Faluss Link transactional behavior contract
        run: php tests/Link/link-hotfix-behavior-test.php
      - name: Faluss Subscriptions historical behavior contracts
        run: for test in tests/Subscriptions/faluss-subscriptions-*.php; do php "$test"; done
      - name: Faluss Identity historical behavior contracts
        run: for test in tests/Identity/contracts/faluss-identity-*.php; do php "$test"; done
      - name: Faluss Events historical behavior contracts
        run: for test in tests/Events/contracts/faluss-events-*.php; do php "$test"; done
      - name: Faluss Analytics historical behavior contracts
        run: for test in tests/Analytics/contracts/faluss-analytics-*.php; do php "$test"; done
      - name: Faluss Federation historical behavior contracts
        run: for test in tests/Federation/contracts/faluss-federation-*.php; do if [ "$test" != "tests/Federation/contracts/faluss-federation-fed01b3-regression-test.php" ]; then php "$test"; fi; done
      - name: Dependency audit
        run: composer audit --locked

  fans-editorial-sql:
    name: Fans editorial isolated SQL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql, gd, mbstring
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Install local database binaries
        run: sudo apt-get update -qq && sudo apt-get install -y mariadb-server mariadb-client
      - name: Isolated SQL transactions and revocation
        run: python3 tests/Fans/Profiles/recipe/run.py --http --publications --messages

  federation-sodium-compat:
    name: Federation without native Sodium
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.1'
          coverage: none
          extensions: :sodium
          ini-file: none
      - name: Faluss Federation sodium_compat regression
        run: php -n -d extension=json.so tests/Federation/contracts/faluss-federation-fed01b3-regression-test.php

  identity-admin-wordpress:
    name: Identity admin-post real WordPress
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wordpress-runtime
      - name: Real creation rotation failure and secret authentication
        run: python3 tests/Identity/recipe/sso-admin-wordpress.py --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --archive "$RUNNER_TEMP/plugin.tar" --vendor "$GITHUB_WORKSPACE/vendor"

  fans-admin-wordpress:
    name: Fans administration real WordPress
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wordpress-runtime
      - name: Fans creator admission real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test
      - name: Fans messaging operator preparation real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --messaging
      - name: Fans B1 private ranking governance real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-b1 --hof-b6-visibility --output "$RUNNER_TEMP/fans-hof-b1-checks.json"
      - name: Fans B2 private session governance real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-b2 --output "$RUNNER_TEMP/fans-hof-b2-checks.json"
      - name: Fans B2 private territory examination real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-territory --output "$RUNNER_TEMP/fans-hof-territory-checks.json"
      - name: Fans B2 private session moderation and recourse real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-review --output "$RUNNER_TEMP/fans-hof-review-checks.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-evidence-fans-admin
          path: ${{ runner.temp }}/fans-hof-*-checks.json
          if-no-files-found: error
          retention-days: 7

  pf-wordpress:
    name: PF WordPress (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - suite: projections
            flags: --f1a
            report: fans-pf-f1a-checks.json
          - suite: session-completion
            flags: --b3-barriers --b3-barrier-completion
            report: hub-pf-b3-barriers-checks.json
          - suite: barrier-http
            flags: --b3-barrier-http --b3-barrier-completion-recovery --b3-barrier-acknowledgement --b1-origin-ack --b3-session-lifecycle
            report: hub-pf-b3-barrier-http-checks.json
          - suite: ranked-inbox
            flags: --b3-ranked-inbox
            report: fans-pf-b3-ranked-inbox-checks.json
          - suite: corpus-joined
            flags: --b3-corpus-reader --b5-sessions --b6-corpus-transaction --b6-primary-refresh --b6-joined-integration
            report: fans-pf-b3-corpus-reader-checks.json
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/wordpress-runtime
      - name: Execute complete recipe on fresh disposable nodes
        env:
          PF_FLAGS: ${{ matrix.flags }}
          PF_REPORT: ${{ matrix.report }}
        shell: bash
        run: |
          set -euo pipefail
          read -ra pf_flags <<< "$PF_FLAGS"
          python3 tests/TokenEngine/recipe/run.py "${pf_flags[@]}" \
            --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" \
            --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/$PF_REPORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wordpress-evidence-${{ matrix.suite }}
          path: ${{ runner.temp }}/${{ matrix.report }}
          if-no-files-found: error
          retention-days: 7

  wordpress-coverage:
    name: WordPress recipe coverage
    needs: [fans-admin-wordpress, pf-wordpress]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require all recipe jobs to succeed
        env:
          RECIPE_RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os, sys; results = json.loads(os.environ["RECIPE_RESULTS"]); sys.exit(not results or any(job["result"] != "success" for job in results.values()))'
      - uses: actions/download-artifact@v4
        with:
          pattern: wordpress-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/wordpress-evidence
      - name: Preserve the trusted baseline assertions
        run: python3 scripts/validate-wordpress-coverage.py "$RUNNER_TEMP/wordpress-evidence"

  wordpress-integration:
    name: WordPress integration tests
    needs: [identity-admin-wordpress, fans-admin-wordpress, pf-wordpress, wordpress-coverage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every integration and coverage result
        env:
          INTEGRATION_RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os, sys; results = json.loads(os.environ["INTEGRATION_RESULTS"]); sys.exit(not results or any(job["result"] != "success" for job in results.values()))'
