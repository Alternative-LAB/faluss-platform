name: PHP quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: Lint, static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, mbstring, xml
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Composer configuration
        run: composer validate --strict
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l faluss-platform.php
      - name: Static analysis
        run: composer analyse
      - name: Unit tests
        run: composer test
      - name: Faluss Link transactional behavior contract
        run: php tests/Link/link-hotfix-behavior-test.php
      - name: Faluss Subscriptions historical behavior contracts
        run: for test in tests/Subscriptions/faluss-subscriptions-*.php; do php "$test"; done
      - name: Faluss Identity historical behavior contracts
        run: for test in tests/Identity/contracts/faluss-identity-*.php; do php "$test"; done
      - name: Faluss Events historical behavior contracts
        run: for test in tests/Events/contracts/faluss-events-*.php; do php "$test"; done
      - name: Faluss Analytics historical behavior contracts
        run: for test in tests/Analytics/contracts/faluss-analytics-*.php; do php "$test"; done
      - name: Faluss Federation historical behavior contracts
        run: for test in tests/Federation/contracts/faluss-federation-*.php; do if [ "$test" != "tests/Federation/contracts/faluss-federation-fed01b3-regression-test.php" ]; then php "$test"; fi; done
      - name: Dependency audit
        run: composer audit --locked

  fans-editorial-sql:
    name: Fans editorial isolated SQL
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pdo_mysql, gd, mbstring
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Install local database binaries
        run: sudo apt-get update -qq && sudo apt-get install -y mariadb-server mariadb-client
      - name: Isolated SQL transactions and revocation
        run: python3 tests/Fans/Profiles/recipe/run.py --http --publications --messages

  federation-sodium-compat:
    name: Federation without native Sodium
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.1'
          coverage: none
          extensions: :sodium
          ini-file: none
      - name: Faluss Federation sodium_compat regression
        run: php -n -d extension=json.so tests/Federation/contracts/faluss-federation-fed01b3-regression-test.php

  identity-admin-wordpress:
    name: Identity admin-post real WordPress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mysqli, pdo_mysql, mbstring
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Install isolated database binaries
        run: sudo apt-get update -qq && sudo apt-get install -y mariadb-server mariadb-client
      - name: Fetch pinned WordPress and CLI test tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://wordpress.org/wordpress-7.1.2.tar.gz -o "$RUNNER_TEMP/wordpress.tar.gz"
          curl --fail --silent --show-error --location https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar -o "$RUNNER_TEMP/wp-cli.phar"
          echo "c0c666689d66b870d8825500bb8e402ed04de52602c61a6f516c6236b8c9ac67  $RUNNER_TEMP/wordpress.tar.gz" | sha256sum --check
          echo "ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  $RUNNER_TEMP/wp-cli.phar" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" -C "$RUNNER_TEMP"
          git archive HEAD -o "$RUNNER_TEMP/plugin.tar"
      - name: Real creation rotation failure and secret authentication
        run: python3 tests/Identity/recipe/sso-admin-wordpress.py --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --archive "$RUNNER_TEMP/plugin.tar" --vendor "$GITHUB_WORKSPACE/vendor"
      - name: Fans creator admission real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test
      - name: Fans messaging operator preparation real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --messaging
      - name: Fans B1 private ranking governance real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-b1 --output "$RUNNER_TEMP/fans-hof-b1-checks.json"
      - name: Fans B2 private session governance real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-b2 --output "$RUNNER_TEMP/fans-hof-b2-checks.json"
      - name: Fans B2 private territory examination real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-territory --output "$RUNNER_TEMP/fans-hof-territory-checks.json"
      - name: Fans B2 private session moderation and recourse real WordPress
        run: python3 tests/Fans/Profiles/recipe/admission-wordpress.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --test --hof-review --output "$RUNNER_TEMP/fans-hof-review-checks.json"
      - name: Hub historical PF concurrency and commit recovery real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-checks.json"
      - name: Hub H1 closed model persistence real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h1 --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h1-checks.json"
      - name: Hub H2 closed reservations real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h2-reservations --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h2-reservations-checks.json"
      - name: Hub H2 closed consumption and commit recovery real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h2 --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h2-consumption-checks.json"
      - name: Hub H3 closed signed persistence real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h3-proofs --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h3-proofs-checks.json"
      - name: Hub Fans H3 closed private HTTP real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h3-http --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h3-http-checks.json"
      - name: Hub H4 closed corrections real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h4 --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h4-corrections-checks.json"
      - name: Hub H4 complete owner snapshots real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h4-snapshots --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h4-snapshots-checks.json"
      - name: Hub Fans H4 private complete snapshots real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --h4-http --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-h4-http-checks.json"
      - name: Fans F1a closed private projections real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --f1a --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/fans-pf-f1a-checks.json"
      - name: Hub B3 closed owner barriers real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-barriers --b3-barrier-completion --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-b3-barriers-checks.json"
      - name: Hub B3 signed barriers isolated HTTP
        run: python3 tests/TokenEngine/recipe/run.py --b3-barrier-http --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-b3-barrier-http-checks.json"
      - name: Hub B3 closed ranked consumption real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-ranked --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-b3-ranked-checks.json"
      - name: Hub B3 closed ranked member snapshots real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-snapshots --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-b3-snapshots-checks.json"
      - name: Hub B3 exhaustive owner corpus source real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-corpus-source --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-b3-corpus-source-checks.json"
      - name: Hub B3 complete immutable corpus and primary fence real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-corpus --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-b3-corpus-checks.json"
      - name: Hub Fans B3 signed corpus private HTTP real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-corpus-http --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/hub-pf-b3-corpus-http-checks.json"
      - name: Fans B3 durable complete corpus inbox real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-corpus-inbox --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/fans-pf-b3-corpus-inbox-checks.json"
      - name: Fans B3 bounded durable corpus reader real WordPress
        run: python3 tests/TokenEngine/recipe/run.py --b3-corpus-reader --source "$GITHUB_WORKSPACE" --core "$RUNNER_TEMP/wordpress" --cli "$RUNNER_TEMP/wp-cli.phar" --output "$RUNNER_TEMP/fans-pf-b3-corpus-reader-checks.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hub-pf-runtime-checks
          path: |
            ${{ runner.temp }}/hub-pf-checks.json
            ${{ runner.temp }}/hub-pf-h1-checks.json
            ${{ runner.temp }}/hub-pf-h2-reservations-checks.json
            ${{ runner.temp }}/hub-pf-h2-consumption-checks.json
            ${{ runner.temp }}/hub-pf-h3-proofs-checks.json
            ${{ runner.temp }}/hub-pf-h3-http-checks.json
            ${{ runner.temp }}/hub-pf-h4-corrections-checks.json
            ${{ runner.temp }}/hub-pf-h4-snapshots-checks.json
            ${{ runner.temp }}/hub-pf-h4-http-checks.json
            ${{ runner.temp }}/fans-pf-f1a-checks.json
            ${{ runner.temp }}/hub-pf-b3-barriers-checks.json
            ${{ runner.temp }}/hub-pf-b3-barrier-http-checks.json
            ${{ runner.temp }}/hub-pf-b3-ranked-checks.json
            ${{ runner.temp }}/hub-pf-b3-snapshots-checks.json
            ${{ runner.temp }}/hub-pf-b3-corpus-source-checks.json
            ${{ runner.temp }}/hub-pf-b3-corpus-checks.json
            ${{ runner.temp }}/hub-pf-b3-corpus-http-checks.json
            ${{ runner.temp }}/fans-pf-b3-corpus-inbox-checks.json
            ${{ runner.temp }}/fans-pf-b3-corpus-reader-checks.json
            ${{ runner.temp }}/fans-hof-b1-checks.json
            ${{ runner.temp }}/fans-hof-b2-checks.json
            ${{ runner.temp }}/fans-hof-territory-checks.json
            ${{ runner.temp }}/fans-hof-review-checks.json
          if-no-files-found: error
