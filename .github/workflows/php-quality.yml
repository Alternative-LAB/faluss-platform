name: PHP quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  php:
    name: Lint, static analysis and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: dom, mbstring, xml
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - name: Composer configuration
        run: composer validate --strict
      - name: PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l && php -l faluss-platform.php
      - name: Static analysis
        run: composer analyse
      - name: Unit tests
        run: composer test
      - name: Dependency audit
        run: composer audit --locked
