name: PR governance

on:
  # Run the workflow from the protected base branch. A PR must not be able to
  # weaken its own governance check by editing this file.
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  validate:
    name: Validate branch and PR content
    runs-on: ubuntu-latest
    env:
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch proposed commit as data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_BRANCH" =~ ^(feat|fix|refactor|docs|chore|test|ci|build|perf|hotfix)/[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Invalid branch name: $PR_BRANCH"
            echo "Use an allowed prefix followed by a lowercase explicit name."
            exit 1
          fi

      - name: Validate required PR sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          body = re.sub(r'<!--.*?-->', '', os.environ['PR_BODY'], flags=re.DOTALL).replace('\r\n', '\n')
          sections = dict(re.findall(r'^## ([^\n]+)\n(.*?)(?=^## |\Z)', body, flags=re.MULTILINE | re.DOTALL))
          required_sections = (
              'Objectif', 'Changements', 'Changelog', 'Vérifications effectuées',
              'Intégration et absence de régression', 'Risques et retour arrière',
              'Captures d’écran',
          )
          for heading in required_sections:
              if heading not in sections:
                  raise SystemExit('Missing required PR section: ' + heading)
              content = re.sub(r'^\s*[-*]\s*$', '', sections[heading], flags=re.MULTILINE)
              if not content.strip():
                  raise SystemExit('Empty required PR section: ' + heading)

          categories = dict(re.findall(r'^### ([^\n]+)\n(.*?)(?=^### |\Z)', sections['Changelog'], flags=re.MULTILINE | re.DOTALL))
          for heading in ('Ajouté', 'Modifié', 'Corrigé', 'Supprimé', 'Migration et compatibilité'):
              content = re.sub(r'^\s*[-*]\s*$', '', categories.get(heading, ''), flags=re.MULTILINE)
              if not content.strip():
                  raise SystemExit('Missing or empty changelog category: ' + heading)

          if re.search(r'^-[ \t]*(?:\[[ \t]*\][ \t]*)?$', body, flags=re.MULTILINE):
              raise SystemExit("Complete every bullet in the PR template. Use 'Sans objet' when necessary.")
          PY

      - name: Validate changelog and commits
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq CHANGELOG.md; then
            echo "Every PR must update CHANGELOG.md."
            exit 1
          fi

          while IFS= read -r subject; do
            emoji="${subject%% *}"
            message="${subject#* }"
            if [[ "$emoji" == "$subject" || ! "$message" =~ ^[A-Z] ]]; then
              echo "Use a gitmoji followed by an English imperative message: $subject"
              exit 1
            fi
            if [[ "$emoji" =~ ^:[a-z][a-z0-9_+-]*:$ ]]; then
              continue
            fi
            if ! EMOJI="$emoji" python3 -c 'import os, sys; code = ord(os.environ["EMOJI"][0]); sys.exit(not (0x1F300 <= code <= 0x1FAFF or 0x2600 <= code <= 0x27BF or 0x2300 <= code <= 0x23FF))'; then
              echo "Use a Unicode gitmoji or :gitmoji: shortcode: $subject"
              exit 1
            fi
          done < <(git log --format=%s "$BASE_SHA".."$HEAD_SHA")

      - name: Publish trusted status on proposed commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [[ "$VALIDATION_RESULT" == success ]]; then
            state=success
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='Faluss PR governance' \
            -f description="Trusted PR policy validation: $state" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
