name: PR governance

on:
  # Run the workflow from the protected base branch. A PR must not be able to
  # weaken its own governance check by editing this file.
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  validate:
    name: Validate branch and PR content
    runs-on: ubuntu-latest
    env:
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out trusted base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch proposed commit as data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Validate branch name
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_BRANCH" =~ ^(feat|fix|chore)/[1-9][0-9]*-[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Invalid branch name: $PR_BRANCH"
            echo "Use feat/, fix/ or chore/, the issue number, and a lowercase English name."
            exit 1
          fi

      - name: Validate linked issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="${PR_BRANCH#*/}"
          issue_number="${issue_number%%-*}"
          if ! ISSUE_NUMBER="$issue_number" python3 - <<'PYISSUE'
          import os
          import re
          import sys
          body = re.sub(r'<!--.*?-->', '', os.environ['PR_BODY'], flags=re.S)
          number = re.escape(os.environ['ISSUE_NUMBER'])
          sys.exit(not re.search(r'(?<![\w/])#' + number + r'(?!\d)', body))
          PYISSUE
          then
            echo 'The PR body must reference the issue number from its branch.' >&2
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}" > "$RUNNER_TEMP/linked-issue.json"
          python3 - <<'PYEXISTS'
          import json
          import os
          from pathlib import Path
          issue = json.loads((Path(os.environ['RUNNER_TEMP']) / 'linked-issue.json').read_text())
          if 'pull_request' in issue or issue['state'] != 'open':
              raise SystemExit('The branch must reference an open issue, not a PR.')
          PYEXISTS

      - name: Validate required PR sections
        shell: bash
        run: |
          set -euo pipefail
          required_sections=(
            "## Objectif"
            "## Changements"
            "## Changelog"
            "## Vérifications effectuées"
            "## Intégration et absence de régression"
            "## Risques et retour arrière"
          )

          for section in "${required_sections[@]}"; do
            if ! grep -Fq "$section" <<< "$PR_BODY"; then
              echo "Missing required PR section: $section"
              exit 1
            fi
          done

          if ! grep -Eq '^### (Ajouté|Modifié|Corrigé|Supprimé)$' <<< "$PR_BODY"; then
            echo "The PR changelog is missing its expected categories."
            exit 1
          fi

          if grep -Eq '^-[[:space:]]*$|^-[[:space:]]*\[[[:space:]]*\][[:space:]]*$' <<< "$PR_BODY"; then
            echo "Complete every bullet in the PR template. Use 'Sans objet' when necessary."
            exit 1
          fi

          if ! python3 - <<'PY'
          import os
          import re
          import sys

          body = os.environ['PR_BODY']
          sections = re.split(r'^## ', body, flags=re.MULTILINE)[1:]
          for section in sections:
              heading, _, content = section.partition('\n')
              if heading in {
                  'Objectif', 'Changements', 'Vérifications effectuées',
                  'Intégration et absence de régression', 'Risques et retour arrière',
              }:
                  content = re.sub(r'<!--.*?-->', '', content, flags=re.DOTALL)
                  content = re.sub(r'^\s*[-*]\s*$', '', content, flags=re.MULTILINE)
                  if not content.strip():
                      print(f'Empty required PR section: {heading}')
                      sys.exit(1)
          PY
          then
            exit 1
          fi

      - name: Validate changelog and commits
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq CHANGELOG.md; then
            echo "Every PR must update CHANGELOG.md."
            exit 1
          fi

          while IFS= read -r subject; do
            if [[ ! "$subject" =~ ^:[a-z][a-z0-9_+-]*:\ [A-Z] ]]; then
              echo "Use :gitmoji: followed by an English imperative message: $subject"
              exit 1
            fi
          done < <(git log --format=%s "$BASE_SHA".."$HEAD_SHA")

      - name: Publish trusted status on proposed commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RESULT: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          if [[ "$VALIDATION_RESULT" == success ]]; then
            state=success
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context='Faluss PR governance' \
            -f description="Trusted PR policy validation: $state" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
